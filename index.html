<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Street Condition Widget</title>

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.34/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.34/"></script>

    <style>
      body {
        margin: 0;
        padding: 20px;
        background: transparent;
        font-family: Georgia, serif;
      }

      .widget {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .donut {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        background: conic-gradient(#4d8658 0% 0%, #e5e5e5 0% 100%);
      }

      .donut[hidden] {
        display: none;
      }

      .donut-inner {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: white;
      }

      .metric-icon {
        width: 90px;
        height: 90px;
        flex-shrink: 0;
        object-fit: contain;
      }

      .metric-icon[hidden] {
        display: none;
      }

      .percent {
        font-size: 52px;
        line-height: 1;
        font-weight: bold;
        color: #1f3a73;
      }

      .label {
        font-size: 20px;
        line-height: 1.15;
        color: #1f3a73;
      }

      .loading {
        color: #666;
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .widget {
          gap: 12px;
        }

        .donut,
        .metric-icon {
          width: 64px;
          height: 64px;
        }

        .donut-inner {
          width: 42px;
          height: 42px;
        }

        .percent {
          font-size: 32px;
        }

        .label {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="widget">
      <div id="donut" class="donut">
        <div class="donut-inner"></div>
      </div>
      <img id="metric-icon" class="metric-icon" alt="" hidden />

      <div>
        <div id="percent" class="percent loading">--%</div>
        <div id="label" class="label">Loading...</div>
      </div>
    </div>

    <script>
      require(["esri/layers/FeatureLayer"], function (FeatureLayer) {
        const FEATURE_SERVICE_URL =
          "https://services7.arcgis.com/BJisQXdgVScP0JMy/arcgis/rest/services/StreetMaintenance/FeatureServer/0";

        const params = new URLSearchParams(window.location.search);

        const metric = (params.get("metric") || "good").toLowerCase();

        const configs = {
          good: {
            where: "PCICONDITI IN ('Category I - Very Good')",
            color: "#4d8658",
            label: "Streets in good <br>condition",
          },

          fair: {
            where: "PCICONDITI = 'Category III - Fair'",
            color: "#f2c94c",
            label: "Streets in fair condition",
          },

          poor: {
            where:
              "PCICONDITI IN ('Category IV - Poor','Category V - Very Poor')",
            color: "#ef7e31",
            label: "Streets in poor condition",
          },
          study: {
            label: "Pavement study year",
            icon: "assets/calendar.png",
          },
          miles: {
            label: "City-maintained streets",
            icon: "assets/road.png",
          },
        };

        const config = configs[metric] || configs.good;

        document.getElementById("label").innerHTML = config.label;

        if (config.icon) {
          document.getElementById("donut").hidden = true;
          const metricIcon = document.getElementById("metric-icon");
          metricIcon.src = config.icon;
          metricIcon.hidden = false;
        }

        const layer = new FeatureLayer({
          url: FEATURE_SERVICE_URL,
        });

        function feetToMiles(feet) {
  return feet * 0.000189394; // 1 foot = 0.000189394 miles
}

        async function updateMiles() {
          try {
            const latestResult = await layer.queryFeatures({
              where: "1=1",
              outStatistics: [
                {
                  statisticType: "sum",
                  onStatisticField: "SectionLen",
                  outStatisticFieldName: "TotalLength",
                }
              ],
              returnGeometry: false,
              outFields: ["SectionLen"],
              
            });
            console.log("Latest Result", latestResult);
            console.log(latestResult.features.length)
            console.log()
            var totalLength = latestResult.features[0].attributes.TotalLength
            totalLength = feetToMiles(Number(totalLength))
            console.log(totalLength)

            document.getElementById("percent").innerHTML = Math.round(totalLength) + "<span style='font-size: 0.55em;'> miles</span>";

            document.getElementById("percent").classList.remove("loading");
          } catch (error) {
            console.error(error);

            document.getElementById("percent").textContent = "N/A";

            document.getElementById("label").innerHTML = "Unable to load data";
          }
        }

        async function updateChart() {
          try {
            const total = await layer.queryFeatureCount();

            const matching = await layer.queryFeatureCount({
              where: config.where,
            });

            const percent =
              total > 0 ? Math.round((matching / total) * 100) : 0;

            document.getElementById("percent").textContent = percent + "%";

            document.getElementById("percent").classList.remove("loading");

            document.getElementById("donut").style.background = `conic-gradient(
                    ${config.color} 0% ${percent}%,
                    #e5e5e5 ${percent}% 100%
                )`;
          } catch (error) {
            console.error(error);

            document.getElementById("percent").textContent = "N/A";

            document.getElementById("label").innerHTML = "Unable to load data";
          }
        }

        async function updateStudy() {
          try {
            const latestResult = await layer.queryFeatures({
              where: "1=1",
              orderByFields: ["PCIDate DESC"],
              returnGeometry: false,
              outFields: ["PCIDate"],
              num: 1,
            });
            const latestEpoch = latestResult.features[0].attributes.PCIDate;
            console.log("Latest Result", latestEpoch);

            const dateString = new Date(latestEpoch).getFullYear();
            console.log("Date String", dateString);

            document.getElementById("percent").textContent = dateString;

            document.getElementById("percent").classList.remove("loading");
          } catch (error) {
            console.error(error);

            document.getElementById("percent").textContent = "N/A";

            document.getElementById("label").innerHTML = "Unable to load data";
          }
        }

        const updateMetric =
          metric === "study"
            ? updateStudy
            : metric === "miles"
              ? updateMiles
              : updateChart;

        updateMetric();
        setInterval(updateMetric, 300000);
      });
    </script>
  </body>
</html>
